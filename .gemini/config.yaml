have_fun: false

# Reviewing these adds noise without catching bugs: generated native projects,
# build output, lockfiles, design source images and the separate static legal
# site, which is plain HTML deployed on its own.
ignore_patterns:
  - "android/**"
  - "ios/**"
  - "dist/**"
  - "package-lock.json"
  - "design/**"
  - "legal/**"
  - "drizzle/*.sql"
  - "expo-env.d.ts"
  - "*.d.ts"

code_review:
  # MEDIUM keeps style nitpicks out. This repo already runs eslint and a strict
  # tsc in CI-equivalent checks, so anything a linter can catch is not worth a
  # review comment.
  comment_severity_threshold: MEDIUM
  max_review_comments: 20
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
